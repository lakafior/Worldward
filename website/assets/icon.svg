<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Preview only: import the separate layer files into Icon Composer.
       Brand palette (sRGB approx of Display P3 values from BrandColor.swift):
       brandRoyal #2959D4 · brandAzure #4C8DEA · brandSky #85CEFA
       tints: #C6E2FB (sky 40%) · #DCEEFD (sky 20%)
       warm accent (lantern/beams only): #F3E3A8 / #F8EDD4 -->

  <g id="layer-1-beams">
    <path d="M 420 348 L 0 250 L 0 478 L 420 420 Z" fill="#F8EDD4"/>
    <path d="M 604 348 L 1024 272 L 1024 440 L 604 416 Z" fill="#F8EDD4"/>
  </g>

  <g id="layer-2-waves-back">
    <path d="M 0 780 C 150 690 300 700 430 780 C 560 860 700 850 830 790 C 920 748 980 760 1024 800 L 1024 1024 L 0 1024 Z" fill="#C6E2FB"/>
  </g>

  <g id="layer-3-lighthouse">
    <!-- finial -->
    <circle cx="512" cy="142" r="30" fill="#2959D4"/>
    <rect x="500" y="166" width="24" height="20" fill="#2959D4"/>
    <!-- dome -->
    <path d="M 388 292 C 388 192 440 158 512 158 C 584 158 636 192 636 292 Z" fill="#4C8DEA"/>
    <!-- cornice -->
    <rect x="372" y="282" width="280" height="30" rx="15" fill="#2959D4"/>
    <!-- lantern room -->
    <rect x="408" y="308" width="208" height="142" fill="#F3E3A8"/>
    <rect x="408" y="308" width="20" height="142" fill="#E7D89A"/>
    <rect x="596" y="308" width="20" height="142" fill="#E7D89A"/>
    <path d="M 470 450 L 470 388 A 42 42 0 0 1 554 388 L 554 450 Z" fill="#FFFFFF"/>
    <!-- railing: 5 posts, sized to stay crisp at small rendered sizes -->
    <rect x="364" y="446" width="296" height="16" rx="8" fill="#2959D4"/>
    <rect x="380" y="446" width="12" height="56" fill="#2959D4"/>
    <rect x="443" y="446" width="12" height="56" fill="#2959D4"/>
    <rect x="506" y="446" width="12" height="56" fill="#2959D4"/>
    <rect x="569" y="446" width="12" height="56" fill="#2959D4"/>
    <rect x="632" y="446" width="12" height="56" fill="#2959D4"/>
    <!-- gallery deck -->
    <rect x="352" y="494" width="320" height="38" rx="19" fill="#4C8DEA"/>
    <rect x="372" y="526" width="280" height="26" rx="13" fill="#85CEFA"/>
    <!-- tower: single flat fill, Liquid Glass supplies the shading -->
    <path d="M 428 552 L 596 552 L 673 1040 L 351 1040 Z" fill="#FFFFFF"/>
    <!-- window -->
    <path d="M 480 724 L 480 662 A 32 32 0 0 1 544 662 L 544 724 Z" fill="#2959D4"/>
    <!-- door -->
    <path d="M 470 1040 L 470 876 A 42 42 0 0 1 554 876 L 554 1040 Z" fill="#2959D4"/>
  </g>

  <g id="layer-4-waves-front">
    <path d="M 0 828 C 170 722 320 748 440 848 C 520 914 590 934 710 906 C 830 878 940 902 1024 962 L 1024 1024 L 0 1024 Z" fill="#DCEEFD"/>
    <path d="M 0 906 C 190 828 340 862 460 930 C 555 984 680 976 800 944 C 900 918 975 940 1024 992 L 1024 1024 L 0 1024 Z" fill="#4C8DEA"/>
  </g>
